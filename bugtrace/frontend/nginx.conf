# HTTP -> HTTPS 跳转（保留 ACME 验证路径，证书续期不需要停 HTTPS）
server {
    listen 80;
    server_name bugtrace.online www.bugtrace.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站
server {
    listen 443 ssl;
    http2 on;
    server_name bugtrace.online www.bugtrace.online;

    # Let's Encrypt 证书（挂载自宿主机 /data/bugtrace/certbot/conf）
    ssl_certificate     /etc/letsencrypt/live/bugtrace.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bugtrace.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # 前端路由（Vue Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 附件静态资源反向代理到后端
    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
