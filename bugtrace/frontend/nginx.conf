# BugTrace 生产 nginx 配置
client_max_body_size 50m;   # 附件上传上限（默认 1MB 会导致大图 413 被前端识别为网络错误）

# HTTP -> HTTPS 跳转（保留 ACME 验证路径，证书续期不需要停 HTTPS）
server {
    listen 80;
    server_name bugtrace.online www.bugtrace.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站
server {
    listen 443 ssl;
    http2 on;
    server_name bugtrace.online www.bugtrace.online;

    # Let's Encrypt 证书（挂载自宿主机 /etc/letsencrypt）
    ssl_certificate     /etc/letsencrypt/live/bugtrace.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bugtrace.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # 构建产物：文件名带 hash 可长期缓存；缺失必须返回 404，
    # 否则会被下面的 SPA 兜底返回 index.html，浏览器把 HTML 当 JS 解析 → 报网络错误
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # index.html 禁止缓存：发版后浏览器必须拿到最新的 chunk 引用
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 前端路由（Vue Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 附件静态资源反向代理到后端
    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
